<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>TruqapEP</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes" />

    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 1;
      }

      #unity-canvas {
        width: 100vw;
        height: 100vh;
        outline: none;
      }

      #orientation-lock {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #111;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        text-align: center;
        padding: 24px;
        align-items: center;
        justify-content: center;
      }
      #orientation-lock.visible { display: flex; }
      #orientation-card {
        max-width: 520px;
        width: 90%;
        background: #1b1b1b;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,.5);
      }
      #orientation-emoji {
        font-size: 48px;
        line-height: 1.2;
        margin-bottom: 10px;
      }

      #unity-loading-bar {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: min(60%, 480px);
      }
      #unity-warning { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); color: #fff; }
    </style>
  </head>

  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>

    <div id="orientation-lock" aria-live="polite">
      <div id="orientation-card">
        <div id="orientation-emoji">🔄</div>
        <h2 style="margin:0 0 8px">Rotate your device</h2>
        <p style="margin:0;opacity:.85">This experience is landscape-only. Please rotate your device to continue.</p>
      </div>
    </div>

    <script>
      
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/09d5daab403c7db0168e42ff42cd5f28.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/8e16d17a98aff6e6f869d99a00c8465d.data.unityweb",
        frameworkUrl: buildUrl + "/5dfbd1306a74518362440e5983f7b1e9.framework.js.unityweb",
        codeUrl: buildUrl + "/8dc04937bb29fda4fc162a09edb03533.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Evoweb",
        productName: "TruqapEP",
        productVersion: "0.0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      const orientationLock = document.getElementById("orientation-lock");
      function isLandscape() {
        return window.innerWidth >= window.innerHeight;
      }
      function updateOverlayAndCanvas() {
        const landscape = isLandscape();
        orientationLock.classList.toggle("visible", !landscape);
        canvas.style.visibility = landscape ? "visible" : "hidden";
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      async function tryLockOrientationLandscape() {
        try {
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape');
          }
        } catch (e) { /* ignore; overlay still handles UX */ }
      }
      window.addEventListener("resize", updateOverlayAndCanvas);
      window.addEventListener("orientationchange", () => {
        updateOverlayAndCanvas();
        tryLockOrientationLandscape();
      });

      updateOverlayAndCanvas();
      tryLockOrientationLandscape();

      loadingBar.style.display = "block";
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (progress * 100) + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      document.addEventListener("touchmove", (e) => {
        if (orientationLock.classList.contains("visible")) e.preventDefault();
      }, { passive: false });
    </script>
  </body>
</html>
